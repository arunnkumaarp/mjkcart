name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mjkcart
          POSTGRES_USER: mjk
          POSTGRES_PASSWORD: mjk
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mjk" --health-interval 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mjk:mjk@localhost:5432/mjkcart
      DJANGO_SECRET_KEY: ci-only-not-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q
      # The web and mobile clients are typed from this file, so it must match the code.
      - name: OpenAPI schema is up to date
        run: |
          python manage.py spectacular --validate --fail-on-warn --file ../packages/api/openapi.yaml
          git diff --exit-code ../packages/api/openapi.yaml

  api-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/api/package-lock.json
      - run: npm ci
      - name: Generated types match openapi.yaml
        run: |
          npm run generate
          git diff --exit-code src/schema.d.ts
      - run: npm run typecheck
