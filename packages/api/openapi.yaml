                $ref: '#/components/schemas/Variant'
          description: ''
    patch:
      operationId: v1_variants_partial_update
      description: Staff manage variants here; customers get them inside the product.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this variant.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVariantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVariantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVariantRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
          description: ''
    delete:
      operationId: v1_variants_destroy
      description: Staff manage variants here; customers get them inside the product.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this variant.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
