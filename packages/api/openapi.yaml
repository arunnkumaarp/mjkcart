      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: v1_products_destroy
      description: Customers see active products that have something to buy; staff
        see everything.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
